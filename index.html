<!doctype html>
<html lang="sv">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Axel & Elina</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/alt.css" />
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://kit.fontawesome.com/d48a501d2e.js" crossorigin="anonymous"></script>
</head>

<body>
    <div class="hero-section">
        <div class="hero">
            <img src="images/AE-datum1.svg" width="33%" />
        </div>
    </div>
    <nav>
        <a href="#intro">Plats</a>
        <a href="#events">Boende</a>
        <a href="#instagram">Klädkod</a>
        <a href="#eng-pics">Önskelista</a>
        <a href="#eng-pics">Tal & Spex</a>
        <a href="#rsvp">OSA</a>
    </nav>
    <section>
        <container>
            <div>Hello World!</div>
        </container>
    </section>

    <section class="video-section">
        <div class="video-background">
            <iframe width="100%" height="315"
                src="https://www.youtube.com/embed/-SCsqVEsQxY?autoplay=1&mute=1&controls=0&loop=1&playlist=-SCsqVEsQxY&showinfo=0&rel=0&start=8&end=170"
                title="YouTube video player" frameborder="0"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                referrerpolicy="strict-origin-when-cross-origin" allowfullscreen>
            </iframe>
        </div>
        <div class="video-content">
            <h2>Östergötland</h2>
            <p>Där Vättern möter Östersjön</p>
        </div>
    </section>

    <section class="rsvp text-center" id="rsvp">
        <container>
            <!-- TODO: Add modal with confirmation -->
            <hr />
            <h3>Vad väntar du på?</h3>
            <p>Sista dagen att OSA är 1 september, men varför inte anmäla sig nu!</p>
            <hr class="bookends">
            <form id="rsvp-form" class="rsvp-form" action="" method="POST">
                <div class="user-box">
                    <input name="name" required>
                    <label><i class="fa fa-user"></i><b> För- och Efternamn</b></label>
                </div>
                <div class="radio-group">
                    <label><i class="fa fa-envelope"></i><b> Kan du komma?</b></label>
                    <div class="radio-checkbox">
                        <input name="coming" value="is coming" type="radio" class="check" id="check1" checked />
                        <label for="check1" class="label">
                            <svg viewBox="0 0 65 65" height="30" width="30">
                                <rect x="7" y="7" width="50" height="50" stroke="#e1b608" stroke-width="3"
                                    fill="none" />
                                <g transform="translate(-23,-967.36216)" id="layer1-60">
                                    <path id="path4146"
                                        d="m 55,978 c -73,19 46,71 15,2 C 60,959 13,966 30,1007 c 12,30 61,13 46,-23"
                                        fill="none" stroke="#e1b608" stroke-width="5" class="path1" />
                                </g>
                            </svg>
                            <span>Självklart!</span>
                        </label>
                    </div>
                    <div class="radio-checkbox">
                        <input name="coming" value="not coming" type="radio" class="check" id="check2" />
                        <label for="check2" class="label">
                            <svg viewBox="0 0 65 65" height="30" width="30">
                                <rect x="7" y="7" width="50" height="50" stroke="#e1b608" stroke-width="3"
                                    fill="none" />
                                <g transform="translate(-23,-967.36216)" id="layer1-60">
                                    <path id="path4146"
                                        d="m 55,978 c -73,19 46,71 15,2 C 60,959 13,966 30,1007 c 12,30 61,13 46,-23"
                                        fill="none" stroke="#e1b608" stroke-width="5" class="path1" />
                                </g>
                            </svg>
                            <span>Har tyvärr annat planerat</span>
                        </label>
                    </div>
                </div>
                <div class="user-box">
                    <input name="allergies" required>
                    <label><i class="fa fa-wheat-awn-circle-exclamation"></i><b> Allergier</b></label>
                </div>
                <div class="user-box">
                    <input name="invite_code" id="invite_code" required>
                    <label><i class="fa fa-key"></i><b> Inbjudningskod</b></label>
                </div>
                <div class="col-md-12" id="alert-wrapper"></div>
                <button>
                    <span>Skicka anmälan!</span>
                </button>
            </form>
        </container>
    </section>

    <section class="alt-section">
        <container>
            <p><b>Hemsida handgjord med <i class="fa fa-heart"></i></b></p>
        </container>
    </section>

    <script src="js/script.js"></script>
</body>

</html>
