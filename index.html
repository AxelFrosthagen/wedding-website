<!doctype html>
<html lang="sv">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Axel & Elina</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/alt.css" />
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
</head>

<body>
    <div class="hero-section">
        <div class="hero">
            <img src="images/logo.png" width="33%" />
        </div>
    </div>
    <nav>
        <a href="#intro">Plats</a>
        <a href="#events">Boende</a>
        <a href="#instagram">Klädkod</a>
        <a href="#eng-pics">Önskelista</a>
        <a href="#eng-pics">Tal & Spex</a>
        <a href="#rsvp">OSA</a>
    </nav>
    <section>
        <container>
            <div>Hello World!</div>
        </container>
    </section>

    <section class="video-section">
        <div class="video-background">
            <iframe width="100%" height="315"
                src="https://www.youtube.com/embed/-SCsqVEsQxY?autoplay=1&mute=1&controls=0&loop=1&playlist=-SCsqVEsQxY&showinfo=0&rel=0&start=8&end=170"
                title="YouTube video player" frameborder="0"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                referrerpolicy="strict-origin-when-cross-origin" allowfullscreen>
            </iframe>
        </div>
        <div class="video-content">
            <h2>Östergötland</h2>
            <p>Där Vättern möter Östersjön</p>
        </div>
    </section>

    <section class="rsvp text-center" id="rsvp">
        <container>
            <!-- TODO: Add modal with confirmation -->
            <h3>Vad väntar du på?</h3>
            <p>Sista dagen att OSA är 1 september, men varför inte anmäla sig nu!</p>
            <form id="rsvp-form" class="rsvp-form" action="" method="POST">
                <i class="fa fa-envelope"></i><input type="email" name="email" class="" placeholder="Mailadress"
                    required>
                <i class="fa fa-user"></i><input name="name" class="" placeholder="Ditt namn" required>
                <i class="fa fa-users"></i><input type="number" name="extras" class="" min="0" max="4"
                    placeholder="Husband/Wife or kids" required>
                <i class="fa fa-key"></i><input name="invite_code" id="invite_code" class=""
                    placeholder="Inbjudnings kod" required>
                <i class="fa fa-users"></i><input name="allergies" class="" placeholder="Eventuella allergier">
                <div class="col-md-12" id="alert-wrapper"></div>
                <button>
                    Skicka anmälan!
                </button>
            </form>
        </container>
    </section>

    <script src="js/script.js"></script>
</body>

</html>
